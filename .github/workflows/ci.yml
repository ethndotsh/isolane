name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by v8-update.yml to test a V8 bump before it opens a PR.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  linux-x64:
    # Native Linux: the lockdown (seccomp, Landlock) can only be tested on a
    # real kernel, not under emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # For test/postgres.test.mjs: postgres.js from a guest, over connect().
    # Password auth, which the image makes SCRAM-SHA-256: postgres.js does
    # SCRAM with crypto.subtle (PBKDF2, HMAC, SHA-256) in the guest.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolane-test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: ./.github/actions/build-worker
        with:
          arch: x64
      - uses: ./.github/actions/test-worker
        with:
          arch: x64
      # For soak.yml, bench.yml, and release.yml.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-linux-x64
          path: |
            ${{ runner.temp }}/isolane-worker
            ${{ runner.temp }}/isolane-escape-worker

  # arm64 is cross-compiled on x64 (rusty_v8's supported route: Chromium's
  # clang and Rust toolchains exist for x64 Linux hosts only) and tested on a
  # native arm64 runner. Its web snapshot is made by running the first
  # build on arm64, then embedded by a second, relink-only build on x64.
  linux-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/build-worker
        with:
          arch: arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-linux-arm64-first-pass
          path: |
            ${{ runner.temp }}/isolane-worker
            ${{ runner.temp }}/isolane-escape-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: linux-arm64-build-log
          path: build/logs/*.log
          if-no-files-found: ignore

  linux-arm64-snapshot:
    needs: linux-arm64-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-linux-arm64-first-pass
          path: ${{ runner.temp }}
      - name: Make the web snapshot
        run: |
          chmod +x "$RUNNER_TEMP/isolane-worker"
          "$RUNNER_TEMP/isolane-worker" --make-web-snapshot="$RUNNER_TEMP/web-snapshot.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-snapshot-linux-arm64
          path: ${{ runner.temp }}/web-snapshot.bin

  linux-arm64-link:
    needs: linux-arm64-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-snapshot-linux-arm64
          path: ${{ runner.temp }}/snapshot
      # The first pass's escape-test worker, which needs no snapshot.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-linux-arm64-first-pass
          path: ${{ runner.temp }}/first-pass
      - uses: ./.github/actions/build-worker
        with:
          arch: arm64
          snapshot: ${{ runner.temp }}/snapshot/web-snapshot.bin
      - name: Collect the workers
        run: cp "$RUNNER_TEMP/first-pass/isolane-escape-worker" "$RUNNER_TEMP/isolane-escape-worker"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-linux-arm64
          path: |
            ${{ runner.temp }}/isolane-worker
            ${{ runner.temp }}/isolane-escape-worker

  linux-arm64:
    needs: linux-arm64-link
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolane-test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-linux-arm64
          path: ${{ runner.temp }}
      - name: Make the workers executable
        run: chmod +x "$RUNNER_TEMP/isolane-worker" "$RUNNER_TEMP/isolane-escape-worker"
      - uses: ./.github/actions/test-worker
        with:
          arch: arm64

  # Known advisories in dependencies: a gate, apart from the long build.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # What the published package installs (dev tools aren't shipped).
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit -D warnings
      # Formatting needs no V8 build, so it's checked here, where it fails fast.
      - name: rustfmt
        run: cargo fmt --check
