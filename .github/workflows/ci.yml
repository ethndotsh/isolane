name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by v8-update.yml to test a V8 bump before it opens a PR.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  linux-x64:
    # Native Linux: the lockdown (seccomp, Landlock) can only be tested on a
    # real kernel, not under emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      V8_FROM_SOURCE: '1'
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
      # The runner image also has clang 16-18; without this, bindgen takes
      # /usr/bin/clang's builtin headers, which don't match libclang 21.
      CLANG_PATH: /usr/lib/llvm-21/bin/clang
      # Link with lld (several times faster than GNU ld on the V8 archive).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/lib/llvm-21/bin/clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Deleting these takes ~1.5 min; do it in the background while the
      # toolchain installs and the sources download, and wait before building.
      - name: Free disk space (in the background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - name: Install libclang 21, strace
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y -q libclang-21-dev libglib2.0-dev strace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rusty_v8
        run: scripts/fetch-rusty-v8.sh

      - name: Restore V8 build
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target
            build/rusty_v8/third_party/rust-toolchain
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v8-linux-x64-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'scripts/v8.gn', 'patches/**', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: v8-linux-x64-

      - name: Wait for the disk space
        run: |
          while pgrep -f 'rm -rf /usr/share/dotnet' >/dev/null; do sleep 2; done
          df -h /

      - name: Build worker (V8 from source, sandbox enabled)
        run: |
          scripts/sync-mtimes.sh
          scripts/build-v8.sh || { tail -100 build/logs/linux-x86_64.log; exit 1; }
          cp target/release/isolane-worker "$RUNNER_TEMP/isolane-worker"

      # Saved right after the build, even when the build fails (a failure
      # in the final steps still leaves hours of compiled V8 worth keeping).
      - name: Save V8 build
        if: always() && steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            build/rusty_v8/third_party/rust-toolchain
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v8-linux-x64-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'scripts/v8.gn', 'patches/**', 'Cargo.lock', 'Cargo.toml') }}

      - name: V8 sandbox self-check
        run: '"$RUNNER_TEMP/isolane-worker" --self-check'

      - name: Build escape-test worker
        # Same V8 build settings as above, so only the isolane crate rebuilds.
        run: |
          cargo build --release -p isolane-worker --features escape-tests
          cp target/release/isolane-worker "$RUNNER_TEMP/isolane-escape-worker"

      - name: Build TypeScript
        run: |
          npm ci
          npx tsc
          npm run typecheck
          (cd examples/serverless && npm ci && npm run typecheck)

      - name: Lockdown tests
        env:
          ISOLANE_WORKER: ${{ runner.temp }}/isolane-worker
          ISOLANE_ESCAPE_WORKER: ${{ runner.temp }}/isolane-escape-worker
        run: node --test --test-reporter=spec test/lockdown.test.mjs

      - name: End-to-end tests (strict mode, lockdown on)
        env:
          ISOLANE_WORKER: ${{ runner.temp }}/isolane-worker
          ISOLANE_STRICT: '1'
        run: node --test --test-reporter=spec $(ls test/*.test.mjs | grep -v lockdown)

      - name: Seccomp kills (kernel log)
        if: always()
        run: sudo dmesg | grep -iE 'seccomp|audit.*sig=31' | tail -40 || true

      - name: Syscall audit
        if: always()
        run: |
          scripts/syscall-audit.sh "$RUNNER_TEMP/isolane-worker" | tee syscall-audit.txt
          { echo '### Syscalls after ready'; echo '```'; cat syscall-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64
          path: |
            syscall-audit.txt
            build/logs/*.log
          if-no-files-found: ignore

      # For soak.yml (fuzzing and stress), which runs against main's build.
      - uses: actions/upload-artifact@v4
        with:
          name: worker-linux-x64
          path: |
            ${{ runner.temp }}/isolane-worker
            ${{ runner.temp }}/isolane-escape-worker
