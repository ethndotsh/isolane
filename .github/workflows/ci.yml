name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by v8-update.yml to test a V8 bump before it opens a PR.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  linux-x64:
    # Native Linux: the lockdown (seccomp, Landlock) can only be tested on a
    # real kernel, not under emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      V8_FROM_SOURCE: '1'
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
      # The runner image also has clang 16-18; without this, bindgen takes
      # /usr/bin/clang's builtin headers, which don't match libclang 21.
      CLANG_PATH: /usr/lib/llvm-21/bin/clang
      # Link with lld (several times faster than GNU ld on the V8 archive).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/lib/llvm-21/bin/clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_INCREMENTAL: '0'
    # For test/postgres.test.mjs: postgres.js from a guest, over connect().
    # Password auth, which the image makes SCRAM-SHA-256: postgres.js does
    # SCRAM with crypto.subtle (PBKDF2, HMAC, SHA-256) in the guest.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolane-test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Deleting these takes ~1.5 min; do it in the background while the
      # toolchain installs and the sources download, and wait before building.
      - name: Free disk space (in the background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - name: Install libclang 21, strace
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y -q libclang-21-dev libglib2.0-dev strace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every cargo command below builds against the same V8, so they must all
      # see the same GN_ARGS (or rusty_v8 regenerates and recompiles V8).
      - name: GN args for V8
        run: echo "GN_ARGS=$(scripts/gn-args.sh)" >>"$GITHUB_ENV"

      # The rusty_v8 + V8 checkout changes only when its pins or our patches
      # do, so it's cached: a hit means no traffic to Chromium's git host,
      # which often fails CI runners with 5xx errors. (The Rust toolchain
      # inside it is in the V8 build cache instead.)
      - name: Restore rusty_v8 sources
        id: v8-src
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rusty_v8
            !build/rusty_v8/third_party/rust-toolchain
          key: rusty-v8-src-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'patches/**') }}

      - name: Fetch rusty_v8 (when not cached)
        run: scripts/fetch-rusty-v8.sh

      - name: Save rusty_v8 sources
        if: steps.v8-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/rusty_v8
            !build/rusty_v8/third_party/rust-toolchain
          key: rusty-v8-src-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'patches/**') }}

      - name: Restore V8 build
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target
            build/rusty_v8/third_party/rust-toolchain
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v8-linux-x64-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'scripts/v8.gn', 'patches/**', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: v8-linux-x64-

      - name: Wait for the disk space
        run: |
          while pgrep -f 'rm -rf /usr/share/dotnet' >/dev/null; do sleep 2; done
          df -h /

      - name: Build worker (V8 from source, sandbox enabled)
        run: |
          scripts/sync-mtimes.sh
          scripts/build-v8.sh || { tail -100 build/logs/linux-x86_64.log; exit 1; }
          cp target/release/isolane-worker "$RUNNER_TEMP/isolane-worker"

      # Saved right after the build, even when the build fails (a failure
      # in the final steps still leaves hours of compiled V8 worth keeping).
      - name: Save V8 build
        if: always() && steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            build/rusty_v8/third_party/rust-toolchain
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v8-linux-x64-${{ hashFiles('scripts/fetch-rusty-v8.sh', 'scripts/v8.gn', 'patches/**', 'Cargo.lock', 'Cargo.toml') }}

      - name: Lint (every unsafe block documented)
        run: cargo clippy --release -p isolane-worker --features escape-tests -- -D clippy::undocumented_unsafe_blocks -D unsafe_op_in_unsafe_fn

      - name: V8 sandbox self-check
        run: '"$RUNNER_TEMP/isolane-worker" --self-check'

      - name: Build escape-test worker
        # Same V8 build settings as above, so only the isolane crate rebuilds.
        run: |
          cargo build --release -p isolane-worker --features escape-tests
          cp target/release/isolane-worker "$RUNNER_TEMP/isolane-escape-worker"

      - name: Build TypeScript
        run: |
          npm ci
          npx tsc
          npm run typecheck
          (cd examples/serverless && npm ci && npm run typecheck)

      - name: Lockdown tests
        env:
          ISOLANE_WORKER: ${{ runner.temp }}/isolane-worker
          ISOLANE_ESCAPE_WORKER: ${{ runner.temp }}/isolane-escape-worker
        run: node --test --test-reporter=spec test/lockdown.test.mjs

      - name: End-to-end tests (strict mode, lockdown on)
        env:
          ISOLANE_WORKER: ${{ runner.temp }}/isolane-worker
          ISOLANE_STRICT: '1'
          ISOLANE_PG_URL: postgres://postgres:isolane-test@localhost:5432/postgres
        run: node --test --test-reporter=spec $(ls test/*.test.mjs | grep -v lockdown)

      # web-platform-tests as a per-subtest gate (test/wpt/expectations.json),
      # served by WPT's own server (Python), against the sandboxed worker.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pinned WPT commit
        id: wpt
        run: echo "commit=$(sed -n "s/^export const WPT_COMMIT = '\(.*\)';/\1/p" test/wpt/run.mjs)" >>"$GITHUB_OUTPUT"

      # Keyed by the commit; the runner's hash too, since it lists the
      # directories to check out (it adds missing ones to a restored copy).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wpt
          key: wpt-${{ steps.wpt.outputs.commit }}-${{ hashFiles('test/wpt/run.mjs') }}
          restore-keys: wpt-${{ steps.wpt.outputs.commit }}-

      - name: WPT gate (strict mode, lockdown on)
        env:
          ISOLANE_WORKER: ${{ runner.temp }}/isolane-worker
          ISOLANE_STRICT: '1'
          ISOLANE_WPT_DIR: ${{ runner.temp }}/wpt
        run: node test/wpt/run.mjs --report wpt-report.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Seccomp kills (kernel log)
        if: always()
        run: sudo dmesg | grep -iE 'seccomp|audit.*sig=31' | tail -40 || true

      - name: Syscall audit
        if: always()
        run: |
          scripts/syscall-audit.sh "$RUNNER_TEMP/isolane-worker" | tee syscall-audit.txt
          { echo '### Syscalls after ready'; echo '```'; cat syscall-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64
          path: |
            syscall-audit.txt
            wpt-report.json
            build/logs/*.log
          if-no-files-found: ignore

      # For soak.yml (fuzzing and stress), which runs against main's build.
      - uses: actions/upload-artifact@v4
        with:
          name: worker-linux-x64
          path: |
            ${{ runner.temp }}/isolane-worker
            ${{ runner.temp }}/isolane-escape-worker
