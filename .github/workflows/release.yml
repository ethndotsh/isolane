name: Release

# Push a tag `vX.Y.Z` (matching package.json's version) to publish isolane
# and its platform packages to npm. Publishing uses npm trusted publishing
# (OIDC: no stored token) with provenance; each package's npm settings must
# list this repository and workflow as its trusted publisher.
#
# Platforms built today: linux-x64-gnu (the full CI run, tests included).
# linux-arm64-gnu and darwin-* join as their build jobs land.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-x64:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref }}

  publish:
    needs: [linux-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@11.21.0

      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Build the library
        run: |
          npm ci
          npx tsc

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-linux-x64
          path: bin/linux-x64

      - name: Pack
        run: node scripts/pack-workers.mjs "$VERSION" linux-x64-gnu=bin/linux-x64/isolane-worker

      - name: Publish the platform packages, then the library
        run: |
          for dir in npm-out/worker-*/ npm-out/isolane/; do
            (cd "$dir" && npm publish --provenance --access public)
          done
