name: Soak

# Fuzzing and stress, run against the worker main's CI last built. Weekly,
# or on demand. Each job uploads a JSON report.
#   protocol-fuzz  hostile fake workers vs. the supervisor
#   corpus         V8's mjsunit corpus through the locked-down worker
#   stress         VM/tenant floods, churn, leaks, noisy neighbours
#   wpt            the WPT gate (test/wpt/run.mjs, also in CI) against main's
#                  worker, with the full report (every subtest's result)
#   test262        the test262 gate (test/test262/run.mjs, also in CI) against
#                  main's worker, with the full report

on:
  schedule:
    - cron: '41 6 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_iterations:
        description: protocol-fuzz iterations
        default: '5000'

permissions:
  contents: read
  actions: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        job: [protocol-fuzz, corpus-0, corpus-1, stress, wpt, test262]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build TypeScript
        run: |
          npm ci
          npx tsc

      - name: Download main's worker
        if: matrix.job != 'protocol-fuzz'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -s success -L 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n worker-linux-x64 -D "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP"/bin/*
          echo "ISOLANE_WORKER=$RUNNER_TEMP/bin/isolane-worker" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/bin/isolane-worker" --self-check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.job == 'wpt'
        with:
          python-version: '3.12'

      - name: V8 tag
        if: startsWith(matrix.job, 'corpus')
        id: v8tag
        run: echo "tag=$(sed -n 's/^V8_TAG=//p' scripts/fetch-rusty-v8.sh)" >>"$GITHUB_OUTPUT"

      # Cached by tag, so it isn't cloned from Chromium's git host (which
      # often fails runners with 5xx errors) every week.
      - name: Restore V8's test corpus
        if: startsWith(matrix.job, 'corpus')
        id: corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/v8
          key: v8-mjsunit-${{ steps.v8tag.outputs.tag }}

      - name: Fetch V8's test corpus (when not cached)
        if: startsWith(matrix.job, 'corpus') && steps.corpus.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.v8tag.outputs.tag }}
        run: |
          for n in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/v8"
            git clone -q --depth 1 --branch "$TAG" --filter=blob:none --sparse https://chromium.googlesource.com/v8/v8.git "$RUNNER_TEMP/v8" &&
              git -C "$RUNNER_TEMP/v8" sparse-checkout set test/mjsunit && exit 0
            echo "clone failed (attempt $n); retrying in $((n * 20))s" >&2
            sleep $((n * 20))
          done
          exit 1

      - name: Run
        env:
          ISOLANE_STRICT: '1'
          JOB: ${{ matrix.job }}
          ITERATIONS: ${{ inputs.fuzz_iterations || '5000' }}
        run: |
          set +e
          case "$JOB" in
            protocol-fuzz) node soak/protocol-fuzz.mjs "$ITERATIONS" ;;
            corpus-*) node soak/corpus.mjs "$RUNNER_TEMP/v8" 3 "${JOB#corpus-}/2" ;;
            stress) node soak/stress.mjs ;;
            wpt)
              node test/wpt/run.mjs --verbose --report "$RUNNER_TEMP/wpt.json" --summary "$GITHUB_STEP_SUMMARY" >&2
              s=$?
              cat "$RUNNER_TEMP/wpt.json"
              (exit $s) ;;
            test262)
              node test/test262/run.mjs --verbose --report "$RUNNER_TEMP/test262.json" --summary "$GITHUB_STEP_SUMMARY" >&2
              s=$?
              cat "$RUNNER_TEMP/test262.json"
              (exit $s) ;;
          esac >report.json
          status=$?
          { echo "### $JOB"; echo '```json'; head -c 60000 report.json; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: soak-${{ matrix.job }}
          path: report.json
