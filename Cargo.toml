[workspace]
resolver = "2"
members = ["crates/worker"]
# build/ holds the rusty_v8 checkout, which is its own workspace.
exclude = ["build"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
string_add = "warn"
fn_params_excessive_bools = "warn"

# What ships: whole-program optimization, abort on panic (a panicking VM
# thread kills the worker, which the supervisor sees as a crash, rather than
# leaving a VM silently stuck), no symbols (V8 crash traces in a static
# binary show offsets either way; symbols only add ~18 MB).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Local iteration: release-speed code, built fast
# (`cargo build --profile fast -p isolane-worker ...`).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
