[workspace]
resolver = "2"
members = ["crates/worker"]
# build/ holds the rusty_v8 checkout, which is its own workspace.
exclude = ["build"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# What ships: whole-program optimization, abort on panic (a panicking VM
# thread kills the worker, which the supervisor sees as a crash, rather than
# leaving a VM silently stuck), no debug info.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Local iteration: release-speed code, built fast
# (`cargo build --profile fast -p isolane-worker ...`).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
