[package]
name = "isolane-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sandbox"]
sandbox = ["v8/v8_enable_sandbox"]
# Local development only (`--no-default-features --features dev-prebuilt`):
# build against rusty_v8's prebuilt V8, which has no sandbox and no clock
# patch, for fast iteration where V8 can't be built. The worker reports its
# sandbox as not secure, which supervisors refuse unless
# ISOLANE_DEV_INSECURE=1 and strict mode is off. Never ship it.
dev-prebuilt = []
# Test-only: `--escape-test <probe>` locks the worker down, then attempts a
# forbidden operation (test/lockdown.test.mjs expects it to fail). Never
# enabled in release artifacts.
escape-tests = []

[dependencies]
# rusty_v8 built from source (V8_FROM_SOURCE=1): no upstream prebuilt has
# the V8 sandbox enabled. The checkout lives in build/ (see scripts/).
v8 = { path = "../../build/rusty_v8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The web platform (src/web/): WHATWG URL, the Encoding Standard, randomness.
url = { version = "2", features = ["expose_internals"] }
encoding_rs = "0.8"
getrandom = "0.2"
# CompressionStream: pure Rust (miniz_oxide for flate2), no C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "8"
# fetch(): data: URLs (Fetch's processor, as Deno uses) and Subresource
# Integrity digests. Pure Rust.
data-url = "0.3"
sha2 = { version = "0.10", features = ["oid"] }
# crypto.subtle (src/web/crypto/, ported from Deno's ext/crypto): the
# RustCrypto crates Deno uses, all pure Rust. Where Deno uses aws-lc-rs (a C
# library with its own OS randomness), the RustCrypto equivalents stand in,
# so every key and nonce comes from the isolate's `random` policy.
aes = "0.8"
aes-gcm = "0.10"
ghash = "0.5"
aes-kw = { version = "0.2", features = ["alloc"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
const-oid = "0.9"
ctr = { version = "0.9", features = ["alloc"] }
curve25519-dalek = "4"
deno_error = "=0.7.1"
ecdsa = "0.16"
ed25519-dalek = "2"
x448 = { version = "=0.14.0-pre.12", default-features = false }
elliptic-curve = { version = "0.13", features = ["std", "arithmetic", "ecdh", "pkcs8", "sec1"] }
hkdf = "0.12"
hmac = "0.12"
num-traits = "0.2"
ocb3 = "0.1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
rand_core = "0.6"
rsa = { version = "0.9", default-features = false, features = ["std"] }
serde_bytes = "0.11"
sha1 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
signature = "2"
spki = "0.7"
thiserror = "2"
x25519-dalek = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"
